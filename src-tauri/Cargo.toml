[package]
name = "holographic-ui"
version = "1.0.0-rc.18-production-candidate"
description = "Holographic UI desktop shell"
authors = ["Holographic UI contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1" }

[dependencies]
tauri = { version = "2.8.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
