[package]
name = "holographic-ui-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = "2.1"

[[bin]]
name = "native-ipc"
path = "native-ipc/fuzz_target.rs"
test = false
doc = false
bench = false
